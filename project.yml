name: DunenDashboard

options:
  bundleIdPrefix: com.crumies
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  DunenDashboard:
    type: application
    platform: iOS

    sources:
      - path: Sources

    resources:
      - path: Assets.xcassets

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Dunen
        CFBundleIdentifier: com.crumies.DunenDashboard
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"

        UILaunchScreen: {}

        NSBluetoothAlwaysUsageDescription: This app uses Bluetooth to connect to the  controller.
        NSLocationWhenInUseUsageDescription: This app does not use GPS for dashboard speed.
        NSMotionUsageDescription: This app does not use phone motion sensors.

    settings:
      base:
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.crumies.DunenDashboard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
